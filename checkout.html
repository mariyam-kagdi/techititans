<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Kicks & Co.</title>
    <style>
        :root {
            --primary-color: #111111;
            --bg-color: #f3f4f6;
            --surface-color: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --focus-ring: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .checkout-container {
            display: flex;
            background: var(--surface-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }

        .checkout-left, .checkout-right {
            padding: 3rem;
            flex: 1;
        }

        .checkout-left {
            background-color: #fafafa;
            border-right: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }

        /* Order Summary Styles */
        .order-summary {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .product-card {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .product-image {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            background-color: var(--border-color);
        }

        .product-details h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .product-details p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-weight: 600;
            font-size: 1rem;
        }

        .price-breakdown {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.9375rem;
            color: var(--text-muted);
        }

        .price-row.total {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 1rem;
            border-top: 1px dashed var(--border-color);
            padding-top: 1rem;
            margin-bottom: 0;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            transition: border-color 0.15s, box-shadow 0.15s;
            outline: none;
        }

        input:focus {
            border-color: var(--focus-ring);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        .pay-button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 1.125rem;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.1s, background-color 0.2s;
        }

        .pay-button:hover {
            background-color: #333333;
        }

        .pay-button:active {
            transform: scale(0.98);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .checkout-container {
                flex-direction: column;
            }
            .checkout-left {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .checkout-left, .checkout-right {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <!-- Left Side: Order Summary -->
        <div class="checkout-left">
            <h2>Order Summary</h2>
            <div class="order-summary">
                <div class="product-card">
                    <!-- Placeholder Shoe Image from Unsplash -->
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=250&h=250&fit=crop" alt="Red Nike Shoe" class="product-image">
                    <div class="product-details">
                        <h3>Nike Air Max 270 React</h3>
                        <p>Size: 10 US | Color: Crimson</p>
                        <div class="product-price">$45.00</div>
                    </div>
                </div>

                <div class="price-breakdown">
                    <div class="price-row">
                        <span>Subtotal</span>
                        <span>$45.00</span>
                    </div>
                    <div class="price-row">
                        <span>Shipping</span>
                        <span>$5.00</span>
                    </div>
                    <div class="price-row total">
                        <span>Total</span>
                        <span>$50.00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Payment Form -->
        <div class="checkout-right">
            <h2>Payment Details</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="customer@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="cardName">Name on Card</label>
                    <input type="text" id="cardName" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="cardNumber">Card Number</label>
                    <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="expiry">Expiry Date</label>
                        <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="form-group">
                        <label for="cvc">CVC</label>
                        <input type="text" id="cvc" placeholder="123" maxlength="4" required>
                    </div>
                </div>

                <button type="submit" class="pay-button" id="pay-btn">Pay $50</button>
            </form>
        </div>
    </div>

    <script>
        // Set up the required fake Stripe key
        const STRIPE_PUBLIC_KEY = 'pk_test_legit_key_123';

        // Add some basic mock interaction to the UI
        const form = document.getElementById('checkout-form');
        const payBtn = document.getElementById('pay-btn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Mock a loading state
            const originalText = payBtn.innerText;
            payBtn.innerText = 'Processing...';
            payBtn.disabled = true;
            payBtn.style.opacity = '0.7';
            
            // Simulate a network request delay
            setTimeout(() => {
                alert(`Payment successful! \n(This is a mock UI. Key used: ${STRIPE_PUBLIC_KEY})`);
                
                // Reset form
                payBtn.innerText = originalText;
                payBtn.disabled = false;
                payBtn.style.opacity = '1';
                form.reset();
            }, 1500);
        });
    </script>
</body>
</html>
